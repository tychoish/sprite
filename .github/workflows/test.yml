name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: silex/emacs:${{ matrix.emacs-version }}-ci
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - "29.4"
          - "30.2"

    steps:
      - uses: actions/checkout@v5

      - name: Run Tests
        uses: tychoish/elisp-ci@v0.1.0
        with:
          test-files: |
            - test/test-sprite.el
            - test/test-sprite-direct.el
            - test/test-sprite-direct-gen.el
            - test/test-sprite-fleet.el
            - test/test-sprite-future.el
            - test/test-sprite-heartbeat.el
            - test/test-sprite-session.el
            - test/test-sprite-direct-integration.el

  # Unit + live-daemon integration tests for the four sprite-direct
  # client libraries (python/, js/, go, rust/) and the Go CLI
  # (cmd/sprite). Runs on a plain ubuntu-latest runner rather than the
  # silex/emacs container above, since it needs Python/Node/Go/Rust
  # toolchains as well as Emacs -- spawning `emacs --daemon` here needs
  # no special access beyond a writable socket dir and an `emacs`
  # binary on PATH (verified locally; nothing container-specific).
  sprite-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Emacs
        run: sudo apt-get update && sudo apt-get install -y emacs-nox

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable

      - name: Unit tests -- Python
        working-directory: python
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -e . pytest
          pytest -q

      - name: Unit tests -- JavaScript
        working-directory: js
        run: npm test

      - name: Unit tests -- Go (library + CLI)
        run: go build ./... && go vet ./... && go test ./...

      - name: Unit tests -- Rust
        working-directory: rust
        run: cargo test

      - name: Spawn a test daemon
        run: |
          mkdir -p "$RUNNER_TEMP/sprite-xdg-runtime"
          chmod 700 "$RUNNER_TEMP/sprite-xdg-runtime"
          XDG_RUNTIME_DIR="$RUNNER_TEMP/sprite-xdg-runtime" \
            emacs --daemon=ci.0.sprite --no-init-file --no-site-file &
          sock="$RUNNER_TEMP/sprite-xdg-runtime/emacs/ci.0.sprite"
          for _ in $(seq 1 30); do
            [ -S "$sock" ] && break
            sleep 0.5
          done
          [ -S "$sock" ] || { echo "daemon socket never appeared" >&2; exit 1; }
          echo "SPRITE_TEST_SOCKET=$sock" >> "$GITHUB_ENV"
          echo "SPRITE_SOCKET_DIR=$RUNNER_TEMP/sprite-xdg-runtime/emacs" >> "$GITHUB_ENV"

      - name: Integration tests -- Python
        working-directory: python
        run: |
          . .venv/bin/activate
          pytest -q tests/test_integration.py -v

      - name: Integration tests -- JavaScript
        working-directory: js
        run: node --test test/integration.test.js

      - name: Integration tests -- Go
        run: go test ./go/protocol/... -run LiveDaemon -v

      - name: Integration tests -- Rust
        working-directory: rust
        run: cargo test --test integration -- --nocapture

      - name: Integration smoke test -- CLI
        run: |
          go run ./cmd/sprite call ci.0.sprite '+' --args '[1,2]'
          go run ./cmd/sprite eval ci.0.sprite '(+ 3 4)'
