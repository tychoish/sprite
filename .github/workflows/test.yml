name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: silex/emacs:${{ matrix.emacs-version }}-ci
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - "29.4"
          - "30.2"
          - "31.1"

    steps:
      - uses: actions/checkout@v5

      - name: Lint Source Code
        uses: tychoish/elisp-ci/lint@v0.1.0

      - name: Run Tests
        uses: tychoish/elisp-ci@v0.1.0

  # Each client runs its unit, integration, and timeout tests against every
  # supported Emacs version. The Go suite also exercises the CLI.
  sprite-clients:
    name: ${{ matrix.client }} / Emacs ${{ matrix.emacs-version }}
    runs-on: ubuntu-latest
    container: silex/emacs:${{ matrix.emacs-version }}-ci
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOFLAGS: ${{ matrix.client == 'go' && '-buildvcs=false' || '' }}
    strategy:
      fail-fast: false
      matrix:
        client: [python, javascript, go, rust]
        emacs-version: ["29.4", "30.2", "31.1"]
    steps:
      - uses: actions/checkout@v5
      - name: Update package index
        if: matrix.client == 'javascript' || matrix.client == 'rust'
        run: apt-get update
      - name: Install JavaScript system dependencies
        if: matrix.client == 'javascript'
        run: apt-get install -y libatomic1
      - name: Install Rust system dependencies
        if: matrix.client == 'rust'
        run: apt-get install -y build-essential
      - uses: actions/setup-python@v5
        if: matrix.client == 'python'
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v5
        if: matrix.client == 'javascript'
        with:
          node-version: "lts/*"
      - uses: actions/setup-go@v5
        if: matrix.client == 'go'
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.client == 'rust'
      - name: Run client tests
        run: emacs --batch -l scripts/ci/sprite-ci.el -f sprite-ci-main test ${{ matrix.client }}

  # Per-language micro-benchmarks (EvalBlocking vs. an `emacsclient
  # --eval` subprocess baseline), throttled to once per UTC day on push;
  # never gates a merge, so each benchmark step uses continue-on-error.
  sprite-bench:
    runs-on: ubuntu-latest
    container: silex/emacs:30.2-ci
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOFLAGS: -buildvcs=false
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - name: Compute today's date (UTC)
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Once-per-day throttle marker
        id: throttle
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: .bench-ran
          key: sprite-bench-ran-${{ steps.date.outputs.today }}

      - name: Determine whether to run
        id: should-run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.throttle.outputs.cache-hit }}" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Benchmark already ran today (UTC); skipping until tomorrow or a manual workflow_dispatch." | tee "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mark benchmark as run today
        if: github.event_name == 'push' && steps.throttle.outputs.cache-hit != 'true'
        run: touch .bench-ran

      - name: Install benchmark system dependencies
        if: steps.should-run.outputs.run == 'true'
        run: |
          apt-get update
          apt-get install -y build-essential libatomic1

      - uses: actions/setup-python@v5
        if: steps.should-run.outputs.run == 'true'
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v5
        if: steps.should-run.outputs.run == 'true'
        with:
          node-version: "lts/*"
      - uses: actions/setup-go@v5
        if: steps.should-run.outputs.run == 'true'
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        if: steps.should-run.outputs.run == 'true'

      - name: Benchmarks
        if: steps.should-run.outputs.run == 'true'
        run: emacs --batch -l scripts/ci/sprite-ci.el -f sprite-ci-main bench
