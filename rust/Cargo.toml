[package]
name = "sprite-direct"
version = "0.1.0"
edition = "2021"
description = "Client library for the sprite-direct Emacs server wire protocol"
license = "GPL-3.0-or-later"
repository = "https://github.com/tychoish/sprite"
keywords = ["emacs", "server", "protocol"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"], optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
cli-example = ["clap"]
async = ["dep:tokio"]

[[example]]
name = "sprite-cli"
required-features = ["cli-example"]
